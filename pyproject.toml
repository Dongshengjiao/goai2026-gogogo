[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goai2026-robodojo"
version = "0.1.0"
description = "GOAI 2026 具身未来赛道 · RoboDojo + XPolicyLab 参赛项目"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "GOAI2026 Team" }]

dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "websockets>=12.0",
    "msgpack>=1.0",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
ml = [
    "torch>=2.1",
    "transformers>=4.36",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["policy_adapter*"]

[tool.ruff]
line-length = 100
target-version = "py310"
